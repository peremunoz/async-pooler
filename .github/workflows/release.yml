name: 🚀 Release & Publish

on:
  push:
    branches:
      - master

jobs:
  verify:
    uses: ./.github/workflows/ci-verify.yml

  publish:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: ⚙️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install deps
        run: bun install --frozen-lockfile

      - name: 🏗️ Build project
        run: bun run build

      - name: 🧾 Get version from package.json
        id: package
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: 🛑 Skip if version already published
        id: check
        run: |
          VERSION=${{ steps.package.outputs.version }}
          if npm view async-pooler@$VERSION > /dev/null 2>&1; then
            echo "⚠️ Version $VERSION already published on npm. Skipping publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🧾 Generate changelog
        id: changelog
        if: steps.check.outputs.skip == 'false'
        run: |
          bunx conventional-changelog -p conventionalcommits --release-count 1 > RELEASE_NOTES.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🏷️ Create Git tag
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.package.outputs.version }}
          TAG="v${VERSION}"
          echo "🏷️ Tagging release as $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: 🚀 Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "//registry.npmjs.org/" > ~/.npmrc
          npm publish --access public
      

      - name: 🧰 Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: "v${{ steps.package.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
